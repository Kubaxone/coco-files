<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coco Files</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
}

h1{
    text-align:center;
    padding:20px;
}

#gallery{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:20px;
    padding:20px;
}

.card{
    background:#222;
    border-radius:10px;
    overflow:hidden;
}

img{
    width:100%;
    display:block;
}
</style>
</head>
<body>

<h1>Coco Files</h1>

<div id="gallery"></div>

<script>
const USER = "Kubaxone";
const REPO = "coco-files";
const BRANCH = "main";

const api =
`https://api.github.com/repos/${USER}/${REPO}/contents/images?ref=${BRANCH}`;

fetch(api)
.then(r => r.json())
.then(files => {

    const gallery = document.getElementById("gallery");

    files.forEach(file => {

        if(file.type !== "file") return;

        if(!file.name.match(/\.(png|jpg|jpeg|gif|webp)$/i)) return;

        const div = document.createElement("div");
        div.className = "card";

        const img = document.createElement("img");
        img.src = file.download_url;
        img.loading = "lazy";

        div.appendChild(img);
        gallery.appendChild(div);

    });

})
.catch(console.error);
</script>

</body>
</html>
